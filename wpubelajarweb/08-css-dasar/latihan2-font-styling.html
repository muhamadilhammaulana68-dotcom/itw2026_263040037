<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan - 2 Font Styling </title>
    <Style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgb(48, 46, 46);
            text-align: center;
        }
        h1 {
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: rgb(101, 100, 100);
            text-shadow: 5px 5px 0 rgb(187, 184, 184);
        }
        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }

        span {
            color: rgb(216, 212, 212);
            text-decoration: line-through;
        }

        .artis {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(205, 196, 196);
            font-weight: normal;
        }
    </Style>
</head>
<body>
    <h1>BERTAHAN DI UJUNG LELAH</h1>
    

    <P class="quote">"Ada yang tetap bertahan meski tak lagi dianggap,dan ada yang memilih
         <span>pergi</span> 
         <br>
    meski sebenarnya masih sangat mencintai."</P> 

    <p class="artis">--33x ILHAM </p>
</body>
</html>
