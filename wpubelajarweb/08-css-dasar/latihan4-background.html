<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan - 2 Font Styling </title>
    <Style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #F8F8FF;
            text-align: center;
            background-color: #0F172A;
            background-image: linear-gradient(to bottom, 
            rgb(15 23 42 / 50% ),
            rgb(15 23 42 / 40%)),
             url(https://picsum.photos/id/10/1000/1000);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        h1 {
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: none;
            /* text-shadow: 5px 5px 0 rgb(215 215 215 / 10%); */
            background-image: linear-gradient(to right, rgb(87, 87, 255)20%,rgb(255, 59, 255));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 0px 10px rgb(12, 255, 202));

        }

        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
            background-color: rgb(255 255 255 / 5%);
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgb(255 255 255 / 10%);
            box-shadow: 0px 10px 30px rgb(0 0 0 / 50%);
        }

        span {
            color: crimson;
            text-decoration: none;
            text-shadow: 0px 0px 10px rgb(248,50,89);
        }

        .artis {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(205 196 196 / 70%);
            font-weight: normal;
            text-transform: uppercase;
            border-top: 1px solid rgb(255 255 255 / 20%);
            width: 30%;
            margin: 30px auto;
            padding-top: 20px;

        }
    </Style>
</head>

<body>
    <h1>BERTAHAN DI UJUNG LELAH</h1>


    <P class="quote">"Ada yang tetap bertahan meski tak lagi dianggap,dan ada yang memilih
        <span>pergi</span>
        <br>
        meski sebenarnya masih sangat mencintai."
    </P>

    <p class="artis">--33x ILHAM </p>
</body>

</html>
